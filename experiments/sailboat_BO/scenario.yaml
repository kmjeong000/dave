study:
  name: sailboat_bo_v1
  namespace: sailboat
  seed: 42
  base_param_file: models/dave_robot_models/config/sailboat/ardurover.parm
  launch_file: examples/dave_demos/launch/dave_robot.launch.py
  world_template_dir: models/dave_worlds/worlds
  world_output_dir: experiments/sailboat_BO/results/generated_worlds
  home_llh: [44.65870, -124.06556, 0.0]
  repeats_per_scenario: 2
  use_mavproxy: false
  use_mavros: false
  mavlink_endpoint: tcp:127.0.0.1:5760
  mavlink_connect_timeout_s: 120
  mavlink_release_timeout_s: 15
  mission_seq_home_offset: true
  sitl_start_delay_s: 10
  arm_initial_delay_s: 30
  arm_total_timeout_s: 120
  arm_retry_interval_s: 15
  force_arm_timeout_s: 30
  force_arm_fallback: true
  post_trial_cooldown_s: 5
  gui: true
  headless: true
  paused: false
  verbose: 0
  sail_force_gate_during_startup: true
  sail_force_enable_topic: /model/sailboat/sail_lift_drag/enable
  sail_force_disable_repeats: 8
  sail_force_enable_repeats: 3
  sail_force_enable_settle_s: 0.5
  startup_state_hold_during_prearm: true
  startup_state_hold_topic: /model/sailboat/startup_hold
  startup_state_hold_repeats: 8
  startup_state_hold_repeat_interval_s: 0.25
  startup_state_release_repeats: 3
  startup_state_release_repeat_interval_s: 0.15
  startup_state_release_settle_s: 0.2
  execution_backend: local
  docker_container: rover-debug-shell
  container_repo_root: /home/docker/sailboat_ws/src/dave

search_space:
  - {name: SAIL_ANGLE_IDEAL, type: float, low: 20.0, high: 50.0}
  - {name: SAIL_NO_GO_ANGLE, type: float, low: 40.0, high: 70.0}
  - {name: SAIL_XTRACK_MAX, type: float, low: 4.0, high: 20.0}
  - {name: ATC_SAIL_P, type: float, low: 0.03, high: 0.40}
  - {name: ATC_STR_ANG_P, type: float, low: 0.8, high: 4.0}
  - {name: ATC_STR_RAT_FF, type: float, low: 0.10, high: 1.20}

termination:
  timeout_s: 240
  success_radius_m: 5.0
  min_speed_mps: 0.25
  stuck_window_s: 20
  stuck_min_progress_delta_m: 0.5
  min_progress_delta_m: 2.0
  no_progress_window_s: 25
  no_progress_margin_m: 0.25
  no_progress_confirm_s: 5
  position_source: gazebo_odometry
  max_roll_deg: 45
  roll_source: gazebo_odometry
  roll_grace_period_s: 10
  roll_violation_window_s: 3
  local_waypoint_capture: true
  waypoint_capture_radius_m: 5.0
  waypoint_capture_hold_s: 1.0

logging:
  sample_hz: 5
  save_rosbag2: false
  # Offline only: this does not contribute to score.py or BO constraints.
  # SAIL_NO_GO_ANGLE remains the frozen per-trial reference angle.
  tack_diagnostics:
    leg_margin_deg: 1.0
    head_to_wind_core_margin_deg: 5.0
    pre_leg_min_duration_s: 5.0
    post_leg_min_duration_s: 5.0
    pre_leg_min_distance_m: 3.0
    post_leg_min_distance_m: 3.0
    min_heading_change_deg: 45.0
    candidate_timeout_s: 30.0
    boom_deadband_deg: 5.0
    boom_max_sample_age_s: 1.5
  csv_fields:
    - sim_time_s
    - elapsed_sim_s
    - elapsed_wall_s
    - realtime_factor
    - x_m
    - y_m
    - x_mav_m
    - y_mav_m
    - x_gz_odom_m
    - y_gz_odom_m
    - yaw_rad
    - yaw_mav_rad
    - mavlink_heading_valid
    - mavlink_heading_deg
    - yaw_gz_odom_rad
    - surge_speed_mps
    - surge_speed_mav_mps
    - surge_speed_gz_odom_mps
    - position_source_used
    - position_source_valid
    - roll_deg
    - roll_mav_deg
    - roll_gz_odom_deg
    - roll_gz_odom_raw_deg
    - pitch_gz_odom_raw_deg
    - roll_source_used
    - roll_source_valid
    - servo_output_valid
    - servo_output_update_count
    - servo1_raw_pwm
    - servo2_raw_pwm
    - rudder_cmd_rad
    - sail_cmd_rad
    - relative_true_wind_angle_deg
    - yaw_rate_deg_s
    - tack_state
    - tack_event_id
    - actual_boom_angle_deg
    - boom_sample_age_s
    - servo2_at_min
    - servo2_at_min_continuous_s
    - servo2_entered_min_this_sample
    - servo2_recovered_this_sample
    - mavlink_wind_valid
    - mavlink_wind_update_count
    - mavlink_wind_direction_deg
    - mavlink_wind_from_direction_rad
    - mavlink_wind_speed_mps
    - mavlink_wind_speed_z_mps
    - mission_seq_raw
    - mission_reached_raw
    - mission_reached_valid
    - waypoint_index_raw
    - waypoint_index
    - waypoint_completed_count
    - waypoint_capture_count
    - waypoint_capture_active
    - waypoint_captured_this_sample
    - distance_to_wp_m
    - nav_wp_dist_m
    - cross_track_error_m
    - nav_xtrack_error_m
    - progress_ratio
    - progress_along_path_m
    - wind_speed_mps
    - wind_direction_rad
    - wind_from_direction_rad
    - target_bearing_rad
    - target_wind_angle_deg

scenarios:
  - id: train_crosswind_straight
    split: train
    termination:
      timeout_s: 480
    world:
      template: waves_wind
      internal_world_name: waves
      wind_world_xyz_mps: [0.0, 8.0, 0.0]
      wind_mag_noise_stddev: 0.0
      wind_dir_noise_stddev: 0.0
      wind_mag_sin_amp_percent: 0.0
      wind_dir_sin_amp_deg: 0.0
    spawn:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      yaw_deg: 0.0
    mission:
      frame: gazebo_xy_m
      waypoints: [[60, 0], [-60, 0]]

  - id: train_upwind_tack
    split: train
    world:
      template: waves_wind
      internal_world_name: waves
      wind_world_xyz_mps: [0.0, 8.0, 0.0]
      wind_mag_noise_stddev: 0.0
      wind_dir_noise_stddev: 0.0
      wind_mag_sin_amp_percent: 0.0
      wind_dir_sin_amp_deg: 0.0
    spawn:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      yaw_deg: 90.0
    mission:
      frame: gazebo_xy_m
      waypoints: [[0, 60], [0, -60]]

  - id: train_dogleg
    split: train
    world:
      template: waves_wind
      internal_world_name: waves
      wind_world_xyz_mps: [0.0, 8.0, 0.0]
      wind_mag_noise_stddev: 0.0
      wind_dir_noise_stddev: 0.0
      wind_mag_sin_amp_percent: 0.0
      wind_dir_sin_amp_deg: 0.0
    spawn:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      yaw_deg: 26.565
    mission:
      frame: gazebo_xy_m
      waypoints: [[40, 20], [80, -20], [120, 0]]

  - id: eval_long_oblique
    split: eval
    termination:
      stuck_window_s: 60
      no_progress_window_s: 60
    world:
      template: waves_wind
      internal_world_name: waves
      wind_world_xyz_mps: [0.0, 8.0, 0.0]
      wind_mag_noise_stddev: 0.0
      wind_dir_noise_stddev: 0.0
      wind_mag_sin_amp_percent: 0.0
      wind_dir_sin_amp_deg: 0.0
    spawn:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      yaw_deg: 59.036
    mission:
      frame: gazebo_xy_m
      waypoints: [[30, 50], [60, 100], [90, 140]]
